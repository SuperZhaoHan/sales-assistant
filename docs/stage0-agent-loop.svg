<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" font-family="PingFang SC, Hiragino Sans GB, sans-serif">
  <rect width="1600" height="1600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6ea5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7d46"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="22" font-weight="600" fill="#1f2937">sales-followup-agent · 阶段 0：Agent 最小循环（run_agent）</text>

  <!-- 入口 -->
  <rect x="340" y="70" width="440" height="60" rx="10" fill="#f7f9fc" stroke="#3b6ea5" stroke-width="2"/>
  <text x="560" y="106" font-size="14" text-anchor="middle" fill="#1f2937">run_agent(task, planner, limits, tools, now)</text>

  <line x1="560" y1="130" x2="560" y2="152" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="154" width="440" height="60" rx="10" fill="#f7f9fc" stroke="#3b6ea5" stroke-width="2"/>
  <text x="560" y="180" font-size="14" text-anchor="middle" fill="#1f2937">intent = classify_intent(task)　→ AgentState</text>
  <text x="560" y="200" font-size="11" text-anchor="middle" fill="#6b7280">关键词规则，字典顺序即优先级</text>

  <line x1="560" y1="214" x2="560" y2="234" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="236" width="440" height="48" rx="10" fill="#f7f9fc" stroke="#3b6ea5" stroke-width="2"/>
  <text x="560" y="265" font-size="14" text-anchor="middle" fill="#1f2937">deadline = now() + limits.timeout_seconds</text>

  <line x1="560" y1="284" x2="560" y2="298" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 停机判定 -->
  <polygon points="560,300 760,355 560,410 360,355" fill="#fff6e6" stroke="#c47f17" stroke-width="2"/>
  <text x="560" y="345" font-size="14" text-anchor="middle" fill="#7c3e00">check_stop(</text>
  <text x="560" y="366" font-size="14" text-anchor="middle" fill="#7c3e00">state, limits, now, deadline)</text>

  <!-- 停机清单 -->
  <rect x="24" y="382" width="232" height="222" rx="8" fill="#fffdf6" stroke="#c47f17" stroke-width="1.5"/>
  <text x="40" y="408" font-size="12" font-weight="600" fill="#7c3e00">判据顺序（顺序即优先级）</text>
  <text x="40" y="438" font-size="11.5" fill="#4b5563">1  answer 已产出 → done</text>
  <text x="40" y="462" font-size="11.5" fill="#4b5563">2  refusal 置上 → refused</text>
  <text x="40" y="486" font-size="11.5" fill="#4b5563">3  steps ≥ max_steps</text>
  <text x="40" y="510" font-size="11.5" fill="#4b5563">4  now &gt; deadline → timeout</text>
  <text x="40" y="534" font-size="11.5" fill="#4b5563">5  tokens / cost 超预算</text>
  <text x="52" y="558" font-size="11.5" fill="#4b5563">→ budget_exceeded</text>
  <text x="40" y="586" font-size="10.5" fill="#9a3412">先判停机，再问规划器</text>

  <!-- 命中：直接出结果 -->
  <line x1="760" y1="355" x2="996" y2="355" stroke="#2f7d46" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="775" y="343" font-size="11" fill="#2f7d46">命中任一判据</text>

  <rect x="1000" y="325" width="440" height="62" rx="10" fill="#eef7ef" stroke="#2f7d46" stroke-width="2"/>
  <text x="1220" y="352" font-size="14" text-anchor="middle" fill="#16402a">_build_result(state, reason)</text>
  <text x="1220" y="372" font-size="11" text-anchor="middle" fill="#4b5563">内部状态 → 对外形状</text>

  <line x1="1220" y1="387" x2="1220" y2="411" stroke="#2f7d46" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1000" y="413" width="440" height="132" rx="10" fill="#eef7ef" stroke="#2f7d46" stroke-width="2"/>
  <text x="1020" y="438" font-size="13" font-weight="600" fill="#16402a">AgentResult（frozen dataclass）</text>
  <text x="1020" y="462" font-size="10.5" fill="#4b5563">ok：stop_reason 是 done 且 answer 非空</text>
  <text x="1020" y="484" font-size="10.5" fill="#4b5563">stop_reason：done / max_steps / budget_exceeded /</text>
  <text x="1020" y="504" font-size="10.5" fill="#4b5563">　　　　　　　timeout / refused</text>
  <text x="1020" y="526" font-size="10.5" fill="#4b5563">partial.steps：每步 action / observation / tokens</text>
  <text x="1020" y="542" font-size="10.5" fill="#4b5563">missing：非 done 时说明还差什么</text>

  <!-- 未命中：问规划器 -->
  <line x1="560" y1="410" x2="560" y2="422" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="572" y="444" font-size="11" fill="#3b6ea5">未命中</text>

  <rect x="340" y="424" width="440" height="60" rx="10" fill="#f7f9fc" stroke="#3b6ea5" stroke-width="2"/>
  <text x="560" y="450" font-size="14" text-anchor="middle" fill="#1f2937">decision = await planner(state)</text>
  <text x="560" y="470" font-size="11" text-anchor="middle" fill="#6b7280">Scripted / Constant / FakeLLM（测试用替身）</text>

  <line x1="560" y1="484" x2="560" y2="501" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="560,503 690,545 560,587 430,545" fill="#fff6e6" stroke="#c47f17" stroke-width="2"/>
  <text x="560" y="550" font-size="13" text-anchor="middle" fill="#7c3e00">有 action？</text>

  <line x1="560" y1="587" x2="560" y2="618" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="572" y="606" font-size="11" fill="#3b6ea5">是</text>

  <rect x="340" y="620" width="440" height="60" rx="10" fill="#f7f9fc" stroke="#3b6ea5" stroke-width="2"/>
  <text x="560" y="645" font-size="13" text-anchor="middle" fill="#1f2937">observation = await tools(action, args)</text>
  <text x="560" y="666" font-size="10.5" text-anchor="middle" fill="#9a3412">tools 为 None 时不抛异常，置 state.refusal</text>

  <line x1="560" y1="680" x2="560" y2="701" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 否：跳过工具 -->
  <path d="M690,545 L830,545 L830,745 L684,745" fill="none" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="698" y="537" font-size="11" fill="#3b6ea5">否（跳过工具）</text>

  <polygon points="560,703 680,745 560,787 440,745" fill="#fff6e6" stroke="#c47f17" stroke-width="2"/>
  <text x="560" y="750" font-size="13" text-anchor="middle" fill="#7c3e00">有 answer？</text>

  <line x1="560" y1="787" x2="560" y2="813" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="572" y="806" font-size="11" fill="#3b6ea5">是</text>

  <rect x="340" y="815" width="440" height="50" rx="10" fill="#f7f9fc" stroke="#3b6ea5" stroke-width="2"/>
  <text x="560" y="846" font-size="13" text-anchor="middle" fill="#1f2937">state.answer = decision.answer</text>

  <line x1="560" y1="865" x2="560" y2="888" stroke="#3b6ea5" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="890" width="440" height="60" rx="10" fill="#f7f9fc" stroke="#3b6ea5" stroke-width="2"/>
  <text x="560" y="916" font-size="14" text-anchor="middle" fill="#1f2937">state.record(Step(...))</text>
  <text x="560" y="936" font-size="10.5" text-anchor="middle" fill="#6b7280">唯一记账入口：steps 追加、tokens 与 cost 累加</text>

  <!-- 回到循环顶部 -->
  <path d="M340,920 L280,920 L280,355 L356,355" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="302" y="700" font-size="11" fill="#7c3aed" transform="rotate(-90 302,700)">下一轮（先判停机）</text>

  <!-- 图例 -->
  <text x="340" y="1000" font-size="11" fill="#9ca3af">蓝 = 循环内的动作；橙 = 判据（唯一能拦住循环的地方）；绿 = 出口；紫 = 回边</text>
  <text x="340" y="1022" font-size="11" fill="#9ca3af">阶段 0 只做到这里：没有 HTTP 入口、没有真实工具、没有持久化——那三项属于阶段 1/2</text>

  <!-- 底部：规划器与实测数字 -->
  <rect x="340" y="1070" width="440" height="250" rx="10" fill="#f7f9fc" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="360" y="1098" font-size="13" font-weight="600" fill="#1f2937">Planner 三种实现</text>
  <text x="360" y="1130" font-size="11.5" font-weight="600" fill="#1f2937">ScriptedPlanner</text>
  <text x="360" y="1148" font-size="10.5" fill="#4b5563">按剧本一步步给；剧本用完再问就抛 AssertionError</text>
  <text x="360" y="1180" font-size="11.5" font-weight="600" fill="#1f2937">ConstantPlanner</text>
  <text x="360" y="1198" font-size="10.5" fill="#4b5563">永远同一动作，带 calls 计数——没有刹车就会一直转</text>
  <text x="360" y="1230" font-size="11.5" font-weight="600" fill="#1f2937">FakeLLMPlanner</text>
  <text x="360" y="1248" font-size="10.5" fill="#4b5563">真调一次 provider，三步走，token 与费用真实累加</text>
  <text x="360" y="1284" font-size="10.5" fill="#9a3412">三者都是测试替身，真实模型在阶段 1 接</text>

  <rect x="820" y="1070" width="620" height="250" rx="10" fill="#eef7ef" stroke="#2f7d46" stroke-width="1.5"/>
  <text x="840" y="1098" font-size="13" font-weight="600" fill="#16402a">五种停机：实测数字（scripts/demo_agent_loop.py）</text>
  <text x="840" y="1132" font-size="11" fill="#4b5563">正常完成　done　　　　　 3 步 / 162 token / $0.002056</text>
  <text x="840" y="1160" font-size="11" fill="#4b5563">步数用尽　max_steps　　　2 步　（删掉此判据 → 8 秒未停，被外部强杀）</text>
  <text x="840" y="1188" font-size="11" fill="#4b5563">预算用尽　budget_exceeded　2 步 / 120 token</text>
  <text x="840" y="1216" font-size="11" fill="#4b5563">超时　　　timeout　　　　 1 步（注入时钟，不真等 30 秒）</text>
  <text x="840" y="1244" font-size="11" fill="#4b5563">拒绝执行　refused　　　　 1 步（tools=None）</text>
  <text x="840" y="1284" font-size="10.5" fill="#9a3412">后四行 token 为 0：用照剧本的假规划器，根本没调模型</text>
</svg>
