logging:
  level: INFO
  json_format: true

server:
  docs_enabled: false
  # Fill in the real origins before deploying.
  cors_origins: []

secrets:
  provider: file
  file_dir: /run/secrets
  required:
    - llm/anthropic_api_key

llm:
  provider: anthropic
  model: claude-opus-5-5
  base_url: null
  allowed_models:
    - claude-opus-5-5
    - claude-sonnet-5-5
  thinking: adaptive
  daily_budget_usd: 100.0

risk:
  fail_closed: true
  rate_limit:
    requests: 30
    window_seconds: 60
  quota:
    enabled: true
    daily_requests: 10000
    daily_tokens: 5000000

redis:
  enabled: true

observability:
  otel_enabled: true
