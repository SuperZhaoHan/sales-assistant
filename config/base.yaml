app:
  name: sales-assistant
  version: 0.1.0

server:
  host: 0.0.0.0
  port: 8000
  workers: 1
  cors_origins: []
  docs_enabled: false
  request_id_header: X-Request-ID

logging:
  level: INFO
  json_format: true
  access_log: true
  redact_keys:
    - password
    - passwd
    - secret
    - token
    - api_key
    - apikey
    - authorization
    - cookie
    - private_key
    - credential
    - signature

secrets:
  provider: env
  file_dir: /run/secrets
  required: []
  cache_ttl_seconds: 300
  env_prefix: ""
  vault_url: null
  vault_mount: secret
  aws_region: null

llm:
  provider: fake
  model: fake-model
  base_url: null
  api_key_ref: secret://llm/anthropic_api_key
  timeout_seconds: 60
  max_retries: 2
  max_tokens: 4096
  max_output_tokens: 8192
  temperature: null
  thinking: adaptive
  allowed_models: []
  system_prompt: null
  max_input_chars: 20000
  cost_per_1m_input: 4.0
  cost_per_1m_output: 20.0
  daily_budget_usd: null
  pii_masking_enabled: false
  stream: false

risk:
  enabled: true
  fail_closed: true
  kill_switch: false
  rate_limit:
    enabled: true
    requests: 60
    window_seconds: 60
  quota:
    enabled: false
    daily_requests: 1000
    daily_tokens: 1000000
  max_input_chars: 20000
  blocked_terms: []
  prompt_injection_enabled: true
  model_allowlist_enabled: true
  budget_enabled: true

redis:
  enabled: false
  url: redis://localhost:6379/0

observability:
  metrics_enabled: true
  otel_enabled: false
  otel_endpoint: null
