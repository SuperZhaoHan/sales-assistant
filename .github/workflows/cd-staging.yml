name: Deploy staging

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository }}
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 前后端分别构建、分别打 tag，分别部署；两个镜像互不依赖。
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:staging
            ${{ env.API_IMAGE }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:staging
            ${{ env.WEB_IMAGE }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to staging
        run: |
          echo "Replace this step with kubectl/helm/SSH deployment."
          echo "API: ${{ env.API_IMAGE }}:staging-${{ github.sha }}"
          echo "WEB: ${{ env.WEB_IMAGE }}:staging-${{ github.sha }}"
      - name: Smoke test
        run: |
          echo "Run: python backend/scripts/smoke_test.py https://staging.example.com"
