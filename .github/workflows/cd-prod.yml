name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (for example staging-<sha> or v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository }}
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote images
        # 前后端分开晋升：任一端回滚都不需要动另一端。
        run: |
          docker buildx imagetools create \
            -t "${API_IMAGE}:prod" \
            "${API_IMAGE}:${{ inputs.image_tag }}"
          docker buildx imagetools create \
            -t "${WEB_IMAGE}:prod" \
            "${WEB_IMAGE}:${{ inputs.image_tag }}"
      - name: Deploy to production
        run: |
          echo "Replace this step with a canary or rolling deployment."
          echo "API: ${API_IMAGE}:${{ inputs.image_tag }}"
          echo "WEB: ${WEB_IMAGE}:${{ inputs.image_tag }}"
      - name: Post-deploy smoke test
        run: |
          echo "Run: python backend/scripts/smoke_test.py https://api.example.com"
      - name: Rollback instructions
        if: failure()
        run: |
          echo "Roll back to the previous stable image tag."
          echo "kubectl rollout undo deployment/sales-followup-agent"
          echo "kubectl rollout undo deployment/sales-followup-agent-web"
