name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (for example staging-<sha> or v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote image
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:prod" \
            "${IMAGE}:${{ inputs.image_tag }}"
      - name: Deploy to production
        run: |
          echo "Replace this step with a canary or rolling deployment."
          echo "Image: ${IMAGE}:${{ inputs.image_tag }}"
      - name: Post-deploy smoke test
        run: |
          echo "Run: python scripts/smoke_test.py https://api.example.com"
      - name: Rollback instructions
        if: failure()
        run: |
          echo "Roll back to the previous stable image tag."
          echo "kubectl rollout undo deployment/sales-assistant"
