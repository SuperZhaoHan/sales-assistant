app:
  name: sales-followup-agent
  version: 0.1.0
  domain: insurance
  store_path: data/app.db

server:
  host: 0.0.0.0
  port: 8000
  workers: 1
  cors_origins: []
  docs_enabled: false
  request_id_header: X-Request-ID

logging:
  level: INFO
  json_format: true
  access_log: true
  redact_keys:
    - password
    - passwd
    - secret
    - token
    - api_key
    - apikey
    - authorization
    - cookie
    - private_key
    - credential
    - signature

secrets:
  provider: env
  file_dir: /run/secrets
  required: []
  cache_ttl_seconds: 300
  env_prefix: ""
  vault_url: null
  vault_mount: secret
  aws_region: null

llm:
  provider: fake
  model: fake-model
  base_url: null
  api_key_ref: secret://llm/anthropic_api_key
  timeout_seconds: 60
  max_retries: 2
  max_tokens: 4096
  max_output_tokens: 8192
  temperature: null
  thinking: adaptive
  allowed_models: []
  system_prompt: null
  max_input_chars: 20000
  cost_per_1m_input: 4.0
  cost_per_1m_output: 20.0
  daily_budget_usd: null
  pii_masking_enabled: false
  stream: false

embedding:
  provider: hash          # hash | openai_compat（接真模型时改成后者）
  model: hash-256         # 真模型用 BAAI/bge-m3（硅基流动，1024 维，免费）
  base_url: null
  api_key_ref: null
  timeout_seconds: 30
  batch_size: 32
  dim: 256

retrieval:
  # 空 = 用 domain pack 里的行业阈值（哈希基线 0.35）。
  # 换 embedding 后必须重扫并在 .env 里覆盖：APP__RETRIEVAL__MIN_SCORE=0.64
  min_score: null
  # 存储后端：memory（进程内全表扫，CI 默认）/ pgvector（真库）
  backend: memory
  table: chunks
  dsn: null
  # 启动期索引行为：
  #   sync     = 只给新增/正文变更的条目算向量（无变更 → 0 次 embedding，默认）
  #   readonly = 启动不写库，只对账；库与语料不一致直接启动失败（库由 build_index.py 负责）
  indexing: sync

agent:
  # 确认窗口（秒）：超过就默认拒绝，避免「走开一小时回来顺手点了确认」
  confirm_ttl_seconds: 300
  # checkpointer 的 PG 连接串；空 = 内存 saver（只适合本地/CI）
  checkpoint_dsn: null

risk:
  enabled: true
  fail_closed: true
  kill_switch: false
  rate_limit:
    enabled: true
    requests: 60
    window_seconds: 60
  quota:
    enabled: false
    daily_requests: 1000
    daily_tokens: 1000000
  max_input_chars: 20000
  blocked_terms: []
  prompt_injection_enabled: true
  model_allowlist_enabled: true
  budget_enabled: true

redis:
  enabled: false
  url: redis://localhost:6379/0

observability:
  metrics_enabled: true
  otel_enabled: false
  otel_endpoint: null
