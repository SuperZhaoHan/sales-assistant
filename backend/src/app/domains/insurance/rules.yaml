# 行业规则：阶段定义、阈值、确认窗口。
# 这些值的共同点是"业务方会改、但改完不需要发版"——所以放在 yaml，不放代码。
stages:
  A: 待首次触达
  B: 已触达未报价
  C: 已报价待决策
  D: 已成交待续保

thresholds:
  # 检索分低于这个值就拒答，不硬编一个答案（阶段 1.7 用）
  retrieval_min_score: 0.35
  # 摘要至少要引用几条事实，否则视为"没读到数据"（阶段 1.3 用）
  summary_min_facts: 1

refusal:
  # 检索不到依据时说的话。放进 pack：换行业时这句话要跟着变（保险说「人工确认」，电商该说「联系客服」）
  text: |
    知识库中未找到与该问题直接相关的内容（{query}，相关性阈值 {min_score}）。
    请如实告知需要人工确认，不要凭常识作答。

task:
  # 写操作确认窗口，超时默认拒绝（阶段 2.4 用）
  confirm_ttl_seconds: 300
