# 语料库：保险私域续保的可检索知识块。
# 全部为教学用虚构内容，不引用任何真实条款、费率或产品名。
# chunk.id 是引用编号的锚点（1.6 要求 citation 能反查到这里），改名会让历史引用失效。
chunks:
  - id: kb-001
    title: 重疾险等待期
    text: 重疾险通常有 90–180 天等待期，等待期内确诊合同约定的重疾，多数产品只退还已交保费、不承担赔付责任。续保时新增的等待期一般按条款另算。
    tags: [重疾险, 等待期, 合同]
  - id: kb-002
    title: 健康告知
    text: 投保前必须如实填写健康告知，未如实告知的既往病史可能成为拒赔理由。告知项通常包括近两年体检异常、住院手术史、长期服药、结节与息肉等。
    tags: [健康告知, 理赔, 如实告知]
  - id: kb-003
    title: 百万医疗免赔额
    text: 百万医疗险一般设 1 万元年免赔额，社保报销后自付部分超过免赔额才启动赔付，赔付比例常见 100%（有社保但未用社保结算时降为 60%）。
    tags: [医疗险, 免赔额, 社保]
  - id: kb-004
    title: 百万医疗续保条件
    text: 是否需要重新核保决定续保稳定性。保证续保期间内产品停售仍可续；非保证续保产品停售后只能转投新产品，需重新健康告知。
    tags: [医疗险, 续保, 核保]
  - id: kb-005
    title: 犹豫期
    text: 长期险投保后有 15 天犹豫期，犹豫期内退保可全额退还已交保费（可能扣工本费），超过犹豫期退保只退现金价值，早期现金价值通常远低于已交保费。
    tags: [犹豫期, 退保, 现金价值]
  - id: kb-006
    title: 宽限期
    text: 分期缴费的保单有 60 天宽限期，宽限期内出险仍可赔付，但需补交保费；超过宽限期未交费，合同进入中止期，中止期内出险不赔。
    tags: [宽限期, 中止, 失效]
  - id: kb-007
    title: 复效
    text: 合同中止后 2 年内可申请复效，需补交保费与利息并重新健康告知；复效后重疾险等待期通常重新计算。
    tags: [复效, 失效, 等待期]
  - id: kb-008
    title: 轻症与中症赔付比例
    text: 轻症、中症赔付比例一般为保额的 20%–30% 与 50%–60%，赔付后不影响重疾保额；部分产品轻症赔付会占用总赔付次数。
    tags: [重疾险, 轻症, 中症, 赔付比例]
  - id: kb-009
    title: 保费豁免
    text: 投保人豁免指投保人身故或确诊约定疾病后，后续保费不用再交、保障继续有效；给孩子投保时常见，需额外付费附加。
    tags: [保费豁免, 投保人, 少儿险]
  - id: kb-010
    title: 现金价值与保单贷款
    text: 现金价值是退保时能拿到的钱，前期低、后期逐步接近已交保费；储蓄型产品后期现价可能超过已交保费。保单贷款额度通常按现价的 80% 计算。
    tags: [现金价值, 退保, 保单贷款]
  - id: kb-011
    title: 定期寿险保额
    text: 定期寿险保身故与全残，保额建议覆盖家庭负债加 5–10 年收入；保障期常见 20/30 年或至 60/70 岁，到期不返还保费。
    tags: [定期寿险, 保额, 家庭责任]
  - id: kb-012
    title: 意外险职业类别
    text: 意外险按职业类别定价，1–3 类低风险职业费率低，4 类以上高空、矿业等高危职业多数产品拒保或需单独投保；投保后变更职业需告知。
    tags: [意外险, 职业类别, 高危职业]
  - id: kb-013
    title: 意外险保障范围
    text: 意外险只赔外来的、突发的、非本意的、非疾病的事故；猝死属疾病，普通意外险不赔，需附加猝死责任；意外医疗通常有 100 元免赔额。
    tags: [意外险, 猝死, 意外医疗]
  - id: kb-014
    title: 年金险
    text: 年金险按合同约定年龄开始领取，领取金额在投保时锁定；前期退保损失大，适合 5 年以上不动用的资金，不适合当短期理财。
    tags: [年金险, 领取, 锁定利率]
  - id: kb-015
    title: 核保结论五档
    text: 核保结论分五档：标准体承保、加费承保、除外承保、延期承保、拒保。除外承保指某项疾病不赔、其他责任照常；加费通常因指标异常或既往症。
    tags: [核保, 加费, 除外, 拒保]
  - id: kb-016
    title: 如实告知义务
    text: 保险法要求投保人就被保险人健康状况与职业风险如实告知；故意隐瞒的，保险人可解除合同且不承担赔付责任，保费可能仅退现价。
    tags: [如实告知, 保险法, 解除合同]
  - id: kb-017
    title: 理赔材料
    text: 医疗险理赔常见材料：发票原件、费用清单、出院小结、诊断证明、病历、银行卡；重疾险还需病理报告或影像报告，部分产品要求二级以上公立医院。
    tags: [理赔, 材料, 医疗险]
  - id: kb-018
    title: 理赔时效
    text: 资料齐全后，小额医疗险通常 3–5 个工作日结案，重疾险需核赔调查，常见 10–30 个工作日；超期可催办并保留提交记录。
    tags: [理赔, 时效, 核赔]
  - id: kb-019
    title: 既往症
    text: 既往症指投保前已存在或已出现症状的疾病，医疗险多数产品对既往症免责；判断依据是投保前病历与体检记录，不是客户自述没看过。
    tags: [既往症, 免责, 医疗险]
  - id: kb-020
    title: 保单年检
    text: 保单年检要看四件事：保额是否覆盖当前负债、保障责任是否重复、受益人是否需变更、缴费账户是否还有效；家庭结构变化后必须重看。
    tags: [保单年检, 保额, 受益人]
  - id: kb-021
    title: 受益人指定
    text: 指定受益人可避免保险金进入遗产、优先用于偿债；未指定时按法定继承处理，可能引发纠纷。变更受益人需被保险人同意并书面申请。
    tags: [受益人, 身故保险金, 继承]
  - id: kb-022
    title: 续保提醒时机
    text: 到期前 30 天是续保黄金窗口：客户还有选择权、核保结果可控；到期后 60 天宽限期内仍可续，但需补缴且部分产品重新核保。
    tags: [续保, 提醒, 窗口]
  - id: kb-023
    title: 失效客户挽回
    text: 失效超过 2 年的保单只能重新投保，年龄增长与健康状况变化可能导致加费或拒保；挽回话术重点讲重新投保的代价，不是补交多少钱。
    tags: [失效, 挽回, 话术]
  - id: kb-024
    title: 异议处理：太贵了
    text: 客户说太贵时先确认对比对象：是同类产品比价，还是预算不足。预算不足就拆方案（先保额后责任、先大人后孩子），不要直接降价换产品。
    tags: [异议处理, 价格, 话术]
  - id: kb-025
    title: 异议处理：有社保就够了
    text: 社保有起付线、封顶线与目录外用药限制，重大疾病的自费药、进口药、靶向药多数不在报销范围；用一张真实费用结构表讲比讲道理有效。
    tags: [异议处理, 社保, 医疗险]
  - id: kb-026
    title: 异议处理：再考虑一下
    text: 再考虑多数是决策链没走完或某个隐性顾虑没说。追问一句是价格、责任还是家人意见，把模糊顾虑变成具体问题再处理。
    tags: [异议处理, 跟进, 话术]
  - id: kb-027
    title: 异议处理：要和家人商量
    text: 家人商量的真实障碍常是另一半不知道谁在受益。把受益人、缴费责任、退保损失讲清楚，再约一次三方在场的时间，比反复催单有效。
    tags: [异议处理, 家人, 决策链]
  - id: kb-028
    title: 续保跟进节奏
    text: 到期客户跟进节奏：T-30 首次触达讲清缺口，T-15 给方案，T-7 处理异议，T-3 最后一提醒，T-0 到期当天确认；超过 4 次无回应降为月度轻触达。
    tags: [跟进节奏, 续保, SOP]
  - id: kb-029
    title: 线索分级
    text: 线索按「意向强度 × 可触达性」分三级：A 级有明确需求且能约到时间，B 级有需求但决策链未明，C 级仅留联系方式；A 级 24 小时内必须首次触达。
    tags: [线索分级, 跟进优先级]
  - id: kb-030
    title: 双录与销售合规
    text: 销售过程需双录（录音录像），不得承诺保证收益、不得代签名、不得夸大保障范围；客户签字前要确认其已阅读条款与免责说明。
    tags: [合规, 双录, 销售行为]
