# 金标集：每个问题对应「哪些 chunk 算命中」。
# 判定口径：top-k 里出现任意一个 expect 的 id 就算这条命中。
# expect 留空的题目是「该拒答」—— 语料里没有答案，答了就是编（D3 才判，D1/D2 只跑检索）。
questions:
