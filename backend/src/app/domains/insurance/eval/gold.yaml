    expect: [kb-006]
  - q: 保单已经失效两年了还能恢复吗？
    expect: [kb-007, kb-023]
  - q: 轻症一般赔保额的多少？
    expect: [kb-008]
  - q: 给孩子买保险能加投保人豁免吗？
