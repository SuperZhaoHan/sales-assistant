# 意图关键词：行业差异最大的一块之一，所以放 pack，不放代码。
# 顺序即优先级：create_task 必须排第一——"给这个客户建个待办"里也含"客户"，
# 排在后面就会被误判成查客户。
intents:
  create_task:
    - 建个待办
    - 创建任务
    - 提醒我
    - 安排一下
    - 记一下
  ask_customer:
    - 客户
    - 线索
    - 什么阶段
    - 到期
    - 保单
    - 资产
    - 跟进到哪
  ask_knowledge:
    - 条款
    - 理赔
    - 怎么算
    - 知识
    - 流程
    - 话术
    - 什么意思
